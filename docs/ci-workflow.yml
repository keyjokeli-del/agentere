name: CI / Automated Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend (Python / FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio mypy

      - name: Run Unit & Collision Tests (Pytest)
        run: pytest

      - name: Type Checking (MyPy)
        run: mypy --ignore-missing-imports backend/app

  whatsapp-quality:
    name: WhatsApp Service (Node.js / Baileys)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: whatsapp-service/package.json

      - name: Install dependencies
        working-directory: whatsapp-service
        run: npm ci

      - name: Syntax Check
        working-directory: whatsapp-service
        run: node -c index.js neonAuthState.js

      - name: Run Neon Auth Adapter Tests
        working-directory: whatsapp-service
        run: node --test test_neon_auth.js

  frontend-quality:
    name: Frontend (Next.js 15 / TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Strict Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Production Build
        working-directory: frontend
        run: npm run build
